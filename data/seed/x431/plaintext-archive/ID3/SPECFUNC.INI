[SW_INFO]
VER=V29.10				;车型诊断版本号
SUPDL=0						;当车型软件支持dlicense是值为1，不支持时值为0
FUNC1=0xAFFB7FFF	;4个字节数据，按位表示支持的32个特殊功能
FUNC2=0x001D4345	;4个字节数据，按位表示支持的32个特殊功能

[MAKE]
DIFF=1;如果子车和主车支持功能不一致
LIST_NUM=5
LIST_001=VW
LIST_002=BENTLEY
LIST_003=BUGATTI
LIST_004=LAMBORGHINI
LIST_005=VW_CV
LIST_006=MAN_TGE ;reset全部发了再放开，否则菜单未定义

[VW]
ID=0x0000000F ;4个字节文本ID
FUNC1=0xAFFB7FFF;支持导航外提特殊功能
FUNC2=0x001D4345	

[BENTLEY]
